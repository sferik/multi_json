name: tests

on:
  push:
    branches: [main, "*-lts"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, "*-lts"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0', 'jruby-9.4', 'jruby-10.0', 'truffleruby', 'truffleruby+graalvm']
        platform: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - ruby-version: truffleruby
            platform: windows-latest
          - ruby-version: truffleruby+graalvm
            platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: false # Do not bundle install yet, need recent versions for Windows
    # Two single-command steps rather than a shell conditional: run steps
    # use PowerShell on Windows and bash elsewhere, and a plain command
    # works in both. The latest Bundler refuses to install on Ruby 2.7,
    # so that row pins the last 2.4.x line.
    - name: Install Bundler
      if: matrix.ruby-version != '2.7'
      run: gem install bundler
    - name: Install Bundler (Ruby 2.7)
      if: matrix.ruby-version == '2.7'
      run: gem install bundler -v '< 2.5'
    - name: Run tests
      run: |
        bundle config set --local path 'vendor/bundle'
        bundle install
        bundle exec rake test
