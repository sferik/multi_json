require:
 - standard

plugins:
 - rubocop-minitest
 - rubocop-performance
 - rubocop-rake
 - standard-performance

AllCops:
  Exclude:
    - ".git/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
  NewCops: enable
  TargetRubyVersion: 3.2

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation
  IndentationWidth: 2

Layout/ArrayAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/CaseIndentation:
  EnforcedStyle: end

Layout/EndAlignment:
  EnforcedStyleAlignWith: start_of_line

Layout/ExtraSpacing:
  AllowForAlignment: false

Layout/LineLength:
  Max: 140

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation
  IndentationWidth: 2

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

Metrics/ParameterLists:
  CountKeywordArgs: false

Style/Alias:
  EnforcedStyle: prefer_alias_method

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

# OptionsCache::Store#fetch has block/no-block semantic asymmetry — the
# block path stores the computed value, the no-block path returns the
# default without writing it. The tests reach into Store#fetch with the
# block form to populate the cache, so the rubocop cop's "redundant
# block" rewrite is wrong for this receiver. The cop only reliably
# fires once frozen_string_literals make every value-block hashable, so
# disable it across the test tree rather than file-by-file.
Style/RedundantFetchBlock:
  Exclude:
    - "test/**/*"

# `MultiJson::Options` deliberately uses named `*args` for the
# callable-forwarding signature so the parameter is self-documenting.
# Rubocop's anonymous `*` rewrite would make the signature opaque about
# what's being forwarded, defeating the documentation that motivated
# the rewrite away from `(...)` in the first place.
Style/ArgumentsForwarding:
  Exclude:
    - "lib/multi_json/options.rb"

Style/RescueStandardError:
  EnforcedStyle: implicit

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/TernaryParentheses:
  EnforcedStyle: require_parentheses_when_complex
