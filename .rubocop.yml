# RuboCop runs this file through ERB before parsing it as YAML. Ruby 2.7
# can only install rubocop 1.64 (the newest standard that supports 2.7 pins
# it), which predates the `plugins:` key, while rubocop 1.72+ warns when a
# plugin-capable extension is listed under `require:`. Pick the key that
# matches the running rubocop so both parse this file without noise.
<% legacy_rubocop = Gem::Version.new(RuboCop::Version::STRING) < Gem::Version.new("1.72") %>
<% if legacy_rubocop %>
require:
 - standard
 - rubocop-minitest
 - rubocop-performance
 - rubocop-rake
 - standard-performance
<% else %>
require:
 - standard

plugins:
 - rubocop-minitest
 - rubocop-performance
 - rubocop-rake
 - standard-performance
<% end %>

AllCops:
  Exclude:
    - ".git/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
  NewCops: enable
  TargetRubyVersion: 2.7

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation
  IndentationWidth: 2

Layout/ArrayAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/CaseIndentation:
  EnforcedStyle: end

Layout/EndAlignment:
  EnforcedStyleAlignWith: start_of_line

Layout/ExtraSpacing:
  AllowForAlignment: false

Layout/LineLength:
  Max: 140

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation
  IndentationWidth: 2

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

Metrics/ParameterLists:
  CountKeywordArgs: false

Style/Alias:
  EnforcedStyle: prefer_alias_method

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

# OptionsCache::Store#fetch has block/no-block semantic asymmetry — the
# block path stores the computed value, the no-block path returns the
# default without writing it. The tests reach into Store#fetch with the
# block form to populate the cache, so the rubocop cop's "redundant
# block" rewrite is wrong for this receiver. The cop only reliably
# fires once frozen_string_literals make every value-block hashable, so
# disable it across the test tree rather than file-by-file.
Style/RedundantFetchBlock:
  Exclude:
    - "test/**/*"

# `MultiJson::Options` deliberately uses named `*args` for the
# callable-forwarding signature so the parameter is self-documenting.
# Rubocop's anonymous `*` rewrite would make the signature opaque about
# what's being forwarded, defeating the documentation that motivated
# the rewrite away from `(...)` in the first place.
Style/ArgumentsForwarding:
  Exclude:
    - "lib/multi_json/options.rb"

Style/RescueStandardError:
  EnforcedStyle: implicit

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/TernaryParentheses:
  EnforcedStyle: require_parentheses_when_complex

<% if legacy_rubocop %>
# The cop versions that ship with rubocop 1.64 misfire on this code base
# in ways later releases fixed: Performance/RedundantBlockCall flags
# `block.call` inside define_method bodies, where `yield` is impossible;
# Minitest/NoTestCases does not see tests pulled in from shared modules;
# and Style/AccessModifierDeclarations rejects `public :a, :b` with more
# than one symbol. Turn those off on the legacy rubocop only.
Performance/RedundantBlockCall:
  Enabled: false
Minitest/NoTestCases:
  Enabled: false
Style/AccessModifierDeclarations:
  Enabled: false
<% end %>
